<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARANTZA GUTIERREZ</title>

    <!-- Fuente elegante de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8a94a6;
            font-weight: 600;
            margin-bottom: 8px;
        }

        h1 {
            color: #1a1d20;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Estilo base de los botones */
        .btn {
            display: block;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        /* Colores aesthetic diferenciados por botón */
        .btn-1 {
            background: linear-gradient(135deg, #6366f1, #4f46e5); /* Púrpura índigo */
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.28);
        }

        .btn-2 {
            background: linear-gradient(135deg, #10b981, #059669); /* Esmeralda pastel */
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.28);
        }

        .btn-3 {
            background: linear-gradient(135deg, #f43f5e, #e11d48); /* Rosa suave / Coral */
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.28);
        }

        /* Efectos Hover super suaves */
        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.08);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <p class="subtitle">PORTAFOLIO DE PROCESOS</p>
        <h1>ARANTZA GUTIERREZ</h1>
        
        <div class="button-group">

                Diagram de Flujo para Aplicación
            </a>

            <!-- Botón 2: Diagram Money -->
            <a href="file:///C:/Users/Administrator/Desktop/PRACTICE/diagram_money.html" target="_blank" class="btn btn-2">
                Diagram Money
            </a>

            <!-- Botón 3: Customer Process -->
            <a href="file:///C:/Users/Administrator/Desktop/PRACTICE/diagram_customer.html" target="_blank" class="btn btn-3">
                Customer Process
            </a>
        </div>
    </div>

</body>
</html>
